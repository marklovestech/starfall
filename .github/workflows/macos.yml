name: macOS

on:
  pull_request:
    paths:
      - .github/workflows/macos.yml
      - macOS/**
      - scripts/build-macos.sh
      - orig1986/product-build/**
      - orig1986/HELPFILE.DAT
      - orig1986/HELPINDX.DAT
      - orig1986/source/TITLESNG.PAS
      - orig1986/source/NOISE.PAS
  push:
    branches: [main]
    paths:
      - .github/workflows/macos.yml
      - macOS/**
      - scripts/build-macos.sh
      - orig1986/product-build/**
      - orig1986/HELPFILE.DAT
      - orig1986/HELPINDX.DAT
      - orig1986/source/TITLESNG.PAS
      - orig1986/source/NOISE.PAS

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path macOS
      - run: ./scripts/build-macos.sh
      - run: codesign --verify --strict build/Starfall.app
